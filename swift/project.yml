name: Story
options:
  bundleIdPrefix: org.nxhx
  deploymentTarget:
    iOS: "27.0"
    macOS: "27.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_STRICT_CONCURRENCY: complete

packages:
  StoryKit:
    path: Packages/StoryKit
  OverstoryWorkingTree:
    path: Packages/OverstoryWorkingTree
  OverstoryObjectStore:
    path: Packages/OverstoryObjectStore
  Overstory:
    path: Packages/Overstory
  OverstoryClient:
    path: Packages/OverstoryClient
  StoryEditor:
    path: Packages/StoryEditor
  Quagmire:
    url: https://github.com/jxe/quagmire.git
    exactVersion: 0.8.0

targets:
  Story:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: StoryApp
        excludes:
          - story-sync-service.c
          - org.nxhx.story.sync.plist
    dependencies:
      - package: StoryKit
      - package: OverstoryWorkingTree
      - package: OverstoryObjectStore
      - package: Overstory
      - package: OverstoryClient
      - package: StoryEditor
      - package: Quagmire
        product: QuagmireExtras
    info:
      path: StoryApp/Info.plist
      properties:
        CFBundleDisplayName: Story
        CFBundleURLTypes:
          - CFBundleURLName: org.nxhx.Arbor.join
            CFBundleURLSchemes: [overstory]
        LSMultipleInstancesProhibited: true
        LSApplicationCategoryType: public.app-category.productivity
        NSCameraUsageDescription: Scan one-time Story device-pairing QR codes.
        NSMicrophoneUsageDescription: Record voice notes to add to Overstory pages.
        NSSpeechRecognitionUsageDescription: Transcribe voice notes into Overstory pages.
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.nxhx.Arbor
        PRODUCT_MODULE_NAME: StoryApp
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: B7P78ULCXS
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": StoryApp/Story.entitlements
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_PREVIEWS: YES
    preBuildScripts:
      - name: Build story-sync helper
        basedOnDependencyAnalysis: false
        script: |
          if [[ "$PLATFORM_NAME" != "macosx" ]]; then
            exit 0
          fi
          BUN_PATH="${BUN_EXECUTABLE:-$(command -v bun)}"
          if [[ -z "$BUN_PATH" || ! -x "$BUN_PATH" ]]; then
            echo "error: Bun is required to build the bundled story-sync helper"
            exit 1
          fi
          HELPER_PATH="$TARGET_BUILD_DIR/$EXECUTABLE_FOLDER_PATH/story-sync"
          SERVICE_PATH="$TARGET_BUILD_DIR/$EXECUTABLE_FOLDER_PATH/story-sync-service"
          HELPER_RESOURCES="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/story-sync"
          AGENT_DIRECTORY="$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Library/LaunchAgents"
          MODULES_PATH="$HELPER_RESOURCES/node_modules/@parcel"
          mkdir -p "$(dirname "$HELPER_PATH")" "$MODULES_PATH" "$AGENT_DIRECTORY"
          /usr/bin/ditto "$BUN_PATH" "$HELPER_PATH"
          "$BUN_PATH" build --target=bun --external @parcel/watcher \
            "$SRCROOT/../packages/story-sync/src/cli.ts" \
            --outfile "$HELPER_RESOURCES/story-sync.js"
          WATCHER_JS_SOURCE="$(cd "$SRCROOT/../packages/fs/node_modules/@parcel/watcher" && pwd -P)"
          /usr/bin/ditto "$WATCHER_JS_SOURCE" "$MODULES_PATH/watcher"
          "$BUN_PATH" build --target=bun --format=cjs \
            "$WATCHER_JS_SOURCE/wrapper.js" \
            --outfile "$MODULES_PATH/watcher/wrapper.js"
          HELPER_ARCH="$CURRENT_ARCH"
          if [[ -z "$HELPER_ARCH" || "$HELPER_ARCH" == "undefined_arch" ]]; then
            HELPER_ARCH="$(uname -m)"
          fi
          case "$HELPER_ARCH" in
            arm64) WATCHER_PACKAGE="watcher-darwin-arm64" ;;
            x86_64) WATCHER_PACKAGE="watcher-darwin-x64" ;;
            *) echo "error: Unsupported story-sync helper architecture: $HELPER_ARCH"; exit 1 ;;
          esac
          WATCHER_NATIVE_SOURCE="$(find "$SRCROOT/../node_modules/.bun" -type d -path "*/node_modules/@parcel/$WATCHER_PACKAGE" -print -quit)"
          if [[ -z "$WATCHER_NATIVE_SOURCE" ]]; then
            echo "error: Missing @parcel/$WATCHER_PACKAGE; run bun install"
            exit 1
          fi
          /usr/bin/ditto "$WATCHER_NATIVE_SOURCE" "$MODULES_PATH/$WATCHER_PACKAGE"
          /usr/bin/xcrun --sdk macosx clang -Os -arch "$HELPER_ARCH" \
            -mmacosx-version-min="$MACOSX_DEPLOYMENT_TARGET" \
            "$SRCROOT/StoryApp/story-sync-service.c" -o "$SERVICE_PATH"
          /usr/bin/ditto "$SRCROOT/StoryApp/org.nxhx.story.sync.plist" \
            "$AGENT_DIRECTORY/org.nxhx.story.sync.plist"
          SIGN_IDENTITY="${EXPANDED_CODE_SIGN_IDENTITY:--}"
          /usr/bin/codesign --force --sign "$SIGN_IDENTITY" \
            "$MODULES_PATH/$WATCHER_PACKAGE/watcher.node"
          /usr/bin/codesign --force --sign "$SIGN_IDENTITY" \
            --entitlements "$SRCROOT/StoryApp/story-sync.entitlements" \
            "$HELPER_PATH"
          /usr/bin/codesign --force --sign "$SIGN_IDENTITY" "$SERVICE_PATH"

  StoryAppTests:
    type: bundle.unit-test
    supportedDestinations: [iOS, macOS]
    sources:
      - path: StoryAppTests
    dependencies:
      - target: Story
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.nxhx.ArborTests
        GENERATE_INFOPLIST_FILE: YES
        "TEST_HOST[sdk=macosx*]": "$(BUILT_PRODUCTS_DIR)/Story.app/Contents/MacOS/Story"
        "BUNDLE_LOADER[sdk=macosx*]": "$(TEST_HOST)"

schemes:
  Story:
    build:
      targets:
        Story: all
        StoryAppTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      environmentVariables:
        STORY_TEST_BUNDLED_HELPER: "1"
        STORY_HOME: "/tmp/StoryNativeAppTests"
      targets:
        - StoryAppTests
