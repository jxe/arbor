services:
  arbor:
    build:
      context: ../../..
      dockerfile: packages/canopyd/deploy/Dockerfile.canopyd
    restart: unless-stopped
    env_file: .env
    command: ["bun", "run", "canopyd", "serve"]
    environment:
      ARBOR_COMMUNITY_HANDLE: ${COMMUNITY_HANDLE}
      ARBOR_FIRST_WRITER_HANDLE: ${FIRST_WRITER_HANDLE}
      ARBOR_FIRST_WRITER_PROFILE: ${FIRST_WRITER_PROFILE}
    volumes:
      - arbor-data:/data
    expose:
      - "4318"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    env_file: .env
    depends_on:
      - arbor
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  arbor-data:
  caddy-data:
  caddy-config:
