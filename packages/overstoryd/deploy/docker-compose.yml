services:
  overstoryd:
    build:
      context: ../../..
      dockerfile: packages/overstoryd/deploy/Dockerfile.overstoryd
    restart: unless-stopped
    env_file: .env
    command: ["bun", "run", "overstoryd", "serve"]
    environment:
      OVERSTORYD_COMMUNITY_HANDLE: ${COMMUNITY_HANDLE}
      OVERSTORYD_FIRST_WRITER_HANDLE: ${FIRST_WRITER_HANDLE}
      OVERSTORYD_FIRST_WRITER_PROFILE: ${FIRST_WRITER_PROFILE}
    volumes:
      - overstoryd-data:/data
    expose:
      - "4318"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    env_file: .env
    depends_on:
      - overstoryd
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  overstoryd-data:
  caddy-data:
  caddy-config:
